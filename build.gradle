plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'fabric-loom' version '1.7-SNAPSHOT'
}

version = mod_version
group = maven_group

repositories {
    mavenCentral()
    mavenLocal()
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://maven.shedaniel.me/' } // Cloth Config, REI
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    } // Modrinth File
    maven {
        name = "Jared's maven"
        url = 'https://maven.blamejared.com/'
    }
    maven {
        name = 'ModMaven'
        url = 'https://modmaven.dev'
    }
    maven {
        url = 'https://maven.terraformersmc.com/releases/'
    }
    maven {
        url = 'https://maven.tterrag.com/'
        content {
            includeGroup 'com.tterrag.registrate'
            includeGroup 'com.simibubi.create'
            includeGroup 'com.jozufozu.flywheel'
        }
    }
    maven {
        url = 'https://maven.latvian.dev/releases'
        content {
            includeGroup 'dev.latvian.mods'
            includeGroup 'dev.latvian.apps'
        }
    }
}

base {
    archivesName = "${project.name}-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

loom {
    splitEnvironmentSourceSets()
    runs {
        client {
            client()
            configName = 'Fabric Client'
            ideConfigGenerated(true)
        }
        server {
            server()
            configName = 'Fabric Server'
            ideConfigGenerated(true)
        }
        datagen {
            data()
            configName = 'Fabric Data Generation'
            ideConfigGenerated(true)
            programArgs '--all', '--mod', mod_id, '--output', file('src/generated/resources').absolutePath, '--existing', file('src/main/resources').absolutePath
        }
    }
}

fabricApi {
    configureDataGeneration()
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings "net.fabricmc:yarn:${yarn_mappings}:v2"

    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    modCompileOnly("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}") { transitive = false }
    modCompileOnly("mezz.jei:jei-${minecraft_version}-fabric-api:${jei_version}") { transitive = false }
    modRuntimeOnly("mezz.jei:jei-${minecraft_version}-fabric:${jei_version}")

    modCompileOnly("me.shedaniel:RoughlyEnoughItems-default-plugin-fabric:${rei_version}")
    modCompileOnly("me.shedaniel:RoughlyEnoughItems-api-fabric:${rei_version}")
    modCompileOnly("me.shedaniel:RoughlyEnoughItems-fabric:${rei_version}")

    modCompileOnly("dev.emi:emi-fabric:${emi_version}") { transitive = false }
    modRuntimeOnly("dev.emi:emi-fabric:${emi_version}")

    modCompileOnly("appeng:appliedenergistics2-fabric:${ae2_version}")

    modCompileOnly("dev.latvian.mods:kubejs-fabric:${kjs_version}") {
        exclude(group: 'dev.architectury')
    }

    modImplementation("maven.modrinth:sodium:${sodium_version}")
    modImplementation("maven.modrinth:iris:${iris_version}")

    modImplementation(include("org.appliedenergistics.yoga:yoga:${yoga_version}"))

    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            'mod_id': mod_id,
            'version': version,
            'minecraft_version': minecraft_version,
            'loader_version': loader_version,
            'mod_license': mod_license,
            'mod_name': mod_name,
            'mod_description': mod_description,
            'mod_url': mod_url
    ]
    inputs.properties replaceProperties

    filesMatching(['fabric.mod.json']) {
        expand replaceProperties + [project: project]
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

tasks.register('printVersion') {
    println(mod_version)
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId = archivesBaseName
            from components.java
        }
    }
    repositories {
        maven {
            url 'https://maven.firstdarkdev.xyz/snapshots'
            credentials {
                username System.getenv('MAVEN_USER')
                password System.getenv('MAVEN_PASS')
            }
        }
    }
}
